[[local|localrc]]

# Password akses terpusat untuk Dashboard, DB, dan Service

ADMIN_PASSWORD=secret

DATABASE_PASSWORD=$ADMIN_PASSWORD

RABBIT_PASSWORD=$ADMIN_PASSWORD

SERVICE_PASSWORD=$ADMIN_PASSWORD



# IP mesin virtual yang digunakan

HOST_IP=192.168.136.128
Q_ML2_TENANT_NETWORK_TYPE=vxlan
Q_ML2_PLUGIN_TYPE_DRIVERS=flat,vlan,vxlan,geneve
ML2_VNI_RANGES=1:1000



# Layanan dasar (Keystone, Glance, Nova, Neutron, Placement, Horizon)

disable_service tempest

LOGFILE=$DEST/logs/stack.sh.log

LOGDAYS=2
